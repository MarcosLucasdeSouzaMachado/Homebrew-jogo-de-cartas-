<!DOCTYPE html>
<html >
    <head>
        <title>Homebrew</title>
        <link rel="stylesheet" href="style\estilo.css">
        <meta charset="UTF-8">
    </head>
    <body>
         <header class="header" id="home">
            <img src="images/logo.png" alt="Logo Homebrew" width="40" height="40" style="border: 5px; border-color: goldenrod; border-radius: 1cm; border-style: solid;">
            <h1>Homebrew</h1>
            <img src="images/hmbr.png" alt="MenuIcon" class="menu-icon" width="25" height="25" id="toggleSidebar">
        </header>
        <div class="Side_Bar">
            <ul>
                <li><a href="#home">Home</a></li>
            </ul>
        </div>

        <script>
            document.getElementById('toggleSidebar').addEventListener('click', function() {
                var sidebar = document.querySelector('.Side_Bar');
                sidebar.style.display = sidebar.style.display === 'none' ? 'flex' : 'none';
            });
        </script>
    </body>
